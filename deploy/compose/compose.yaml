# Talaria: the hub (web app), the agent and a sandbox (where the agent runs commands), on one host.
#
#   docker compose up -d --wait                          # start it
#   docker compose logs init                             # the address to open; then click Connect a model
#   docker compose exec -u hermes hermes hermes model    # or pick a model here (talaria-demo with profile demo)
#
# Settings are in .env (copy .env.example). Every secret is made by the init service on the first start and
# kept in the "secrets" volume. Optional parts are profiles: demo, ollama, honcho, honcho-embeddings. Web search
# (SearXNG) is on; TALARIA_SEARXNG=0 in .env turns it off.
name: talaria

x-images:
  hub: &hub-image ghcr.io/usa-reddragon/talaria-hub:v0.26.78@sha256:1cae8ef5c8ac4139250912b3c7294e2e7d132f71f0850b38b10295673ba84059
  # Talaria Hermes: Hermes Agent with the Talaria patches (https://usa-reddragon.github.io/talaria/deploy/images.html)
  hermes: &hermes-image ${TALARIA_HERMES_IMAGE:-ghcr.io/usa-reddragon/talaria-hermes:v0.23.1-p37@sha256:bd7a3b43c3d38c6dc71b9377443b65ac1a115124c657272fcf539745c7dae647}
  device: &device-image ghcr.io/usa-reddragon/talaria:v0.26.0@sha256:c882110cb0ca0c44abac701aef5413655b2d7faebbcb871160d14dbd17c6e22c
  sandbox: &sandbox-image ghcr.io/usa-reddragon/talaria-sandbox:v0.26.0@sha256:95c0ad9f33ab6bb5f19064c4c9cca23b05b5b635b6fb10999d1895d843b81090
  # SearXNG, the agent's web search (https://docs.searxng.org)
  searxng: &searxng-image docker.io/searxng/searxng:2026.11.13-8a53a6aa5@sha256:82b222dd1854c43241874874fbc985006556230804dc819ef2a639eeb574d0e2
  caddy: &caddy-image docker.io/library/caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d

x-hermes-env: &hermes-env
  HERMES_HOME: /opt/data
  # File tools may write in the agent's data folder and in the sandbox's /work
  HERMES_WRITE_SAFE_ROOT: /opt/data:/work
  TZ: ${TZ:-}
  # Connect a model in Talaria, or: docker compose exec -u hermes hermes hermes model
  # With profile demo, the demo model is offered to the agent as the provider talaria-demo
  TALARIA_DEMO_URL: http://demo-llm:8000/v1
  TALARIA_DEMO_PROBE: "1"
  TALARIA_HONCHO_URL: ${TALARIA_HONCHO_URL:-}

services:
  # Makes the secrets once, writes the hub config on every start, prints the address
  init:
    image: *caddy-image
    entrypoint: ["/bin/sh", "/files/init.sh"]
    user: "0:0"
    environment:
      TALARIA_PUBLIC_URL: ${TALARIA_PUBLIC_URL:-http://localhost:${TALARIA_PORT:-8080}}
      TALARIA_USER: ${TALARIA_USER:-}
      TALARIA_PUSH_CONTACT: ${TALARIA_PUSH_CONTACT:-}
      TALARIA_TELEGRAM_TOKEN: ${TALARIA_TELEGRAM_TOKEN:-}
      TALARIA_HONCHO_URL: ${TALARIA_HONCHO_URL:-}
    volumes:
      - ./files:/files:ro
      - secrets:/secrets
      - hub-data:/hub-data
      - sandbox-work:/work
      - hermes-data:/hermes-data
      - caddy-data:/caddy-data

  # Copies the talaria device plugin out of its image, for hermes-init
  plugin:
    image: *device-image
    user: "0:0"
    command: ["plugin", "install", "--dest", "/plugin-src/device"]
    volumes:
      - plugin-src:/plugin-src

  # Sets up the agent's data folder: device plugin, hub public key, Talaria settings in config.yaml
  # Runs the script directly, not through the image's entrypoint: that one would also start a gateway here
  hermes-init:
    image: *hermes-image
    entrypoint: ["/opt/hermes/.venv/bin/python", "-I", "/files/hermes-init.py"]
    user: "10000:10000"
    environment:
      <<: *hermes-env
      HOME: /opt/data
      # Web search through the searxng service, unless you set another way (https://usa-reddragon.github.io/talaria/deploy/reference.html#web-search)
      TALARIA_SEARXNG: ${TALARIA_SEARXNG:-1}
      TALARIA_SEARXNG_URL: http://searxng:8080
    depends_on:
      init:
        condition: service_completed_successfully
      plugin:
        condition: service_completed_successfully
      # Only with profile demo: then hermes-init offers it to the agent as a provider
      demo-llm:
        condition: service_healthy
        required: false
    volumes:
      - ./files:/files:ro
      - hermes-data:/opt/data
      - plugin-src:/plugin-src:ro
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: hermes

  hermes:
    image: *hermes-image
    command: ["gateway", "run"]
    restart: unless-stopped
    environment: *hermes-env
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    volumes:
      - hermes-data:/opt/data
    # A stop lets running turns finish first
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:9120/api/health"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 3m
      start_interval: 2s

  # Hosts one hermes acp per editor connection that the hub forwards (talaria acp). Shares the Hermes container's
  # network, as acp-host talks to the gateway on localhost. The image is Hermes with the talaria binary added
  acp-host:
    build:
      args:
        HERMES_IMAGE: *hermes-image
        DEVICE_IMAGE: *device-image
      dockerfile_inline: |
        ARG DEVICE_IMAGE
        ARG HERMES_IMAGE
        FROM $${DEVICE_IMAGE} AS device
        FROM $${HERMES_IMAGE}
        COPY --from=device /talaria /usr/local/bin/talaria
    entrypoint: ["/usr/local/bin/talaria"]
    command: ["acp-host"]
    user: "10000:10000"
    restart: unless-stopped
    network_mode: service:hermes
    depends_on:
      hermes:
        condition: service_healthy
    environment:
      <<: *hermes-env
      HOME: /opt/data
      TMPDIR: /tmp
      TALARIA_UPDATE_AUTO: "false"
      TALARIA_ACP_HOST_LISTEN: ":9130"
      TALARIA_ACP_HOST_BACKEND_ID: main
      TALARIA_ACP_HOST_PLACEHOLDER: /opt/data/device-placeholder
      TALARIA_ACP_HOST_HERMES: /opt/hermes/.venv/bin/hermes
      TALARIA_ACP_HOST_HUB_PUBLIC_KEY_FILE: /opt/data/talaria/hub_public_key.pem
    volumes:
      - hermes-data:/opt/data
    tmpfs:
      - /tmp:uid=10000,gid=10000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "-o", "/dev/null", "http://127.0.0.1:9130/healthz"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 20s
      start_interval: 2s

  # The one published port. The hub lives in this container's network
  front:
    image: *caddy-image
    restart: unless-stopped
    # Unprivileged, as the hub's user
    user: "65534:65534"
    depends_on:
      init:
        condition: service_completed_successfully
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      # Same port inside and outside
      TALARIA_SITE: ${TALARIA_SITE:-:${TALARIA_PORT:-8080}}
      TALARIA_TLS_LINE: ${TALARIA_TLS:+tls ${TALARIA_TLS}}
    ports:
      - "${TALARIA_PORT:-8080}:${TALARIA_PORT:-8080}"
    volumes:
      - ./files/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    tmpfs:
      - /config:uid=65534,gid=65534
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8079/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  hub:
    image: *hub-image
    restart: unless-stopped
    network_mode: service:front
    depends_on:
      init:
        condition: service_completed_successfully
        # init rewrites their configs from .env: start them again after it ran
        restart: true
      front:
        condition: service_started
    environment:
      CONFIG: /secrets/config.yaml
      TMPDIR: /tmp
      HUB_HTTP_PORT: "8081"
      HUB_HTTP_PUBLIC_URL: ${TALARIA_PUBLIC_URL:-http://localhost:${TALARIA_PORT:-8080}}
      HUB_STORE_DRIVER: sqlite
      HUB_STORE_PATH: /data/talaria-hub.db
      HUB_DEVICE_ENABLED: "true"
      # Caddy runs in the same network namespace, so device addresses come from X-Forwarded-For
      HUB_DEVICE_TRUSTED_PROXIES: 127.0.0.1/32
      HUB_UI_TIME_ZONE: ${TZ:-UTC}
      # Which install this is, so the hub shows commands that fit it
      HUB_UI_INSTALL: compose
      HUB_CLAUDE_TIME_ZONE: ${TZ:-UTC}
      # Login settings (HUB_AUTH_MODE, HUB_OIDC_*, HUB_AUTH_PROXY_*): add them in compose.override.yaml, see https://usa-reddragon.github.io/talaria/deploy/auth.html
    volumes:
      - hub-data:/data
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: hub
    tmpfs:
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Where the agent runs commands for chats that are not on one of your computers
  sandbox:
    image: *sandbox-image
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      TALARIA_HUB_URL: http://front:8081
      TALARIA_HUB_TOKEN_FILE: /secrets/token
    volumes:
      - sandbox-work:/work
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: sandbox
    read_only: true
    tmpfs:
      - /tmp

  # The agent's web search: SearXNG, reachable only inside this compose network (no published port).
  # TALARIA_SEARXNG=0 in .env turns it off
  searxng:
    image: *searxng-image
    restart: unless-stopped
    user: "977:977"
    # The key it signs its cookies with is made by init on the first start
    entrypoint: ["/bin/sh", "-c", "SEARXNG_SECRET=$$(cat /secrets/secret) && [ -n \"$$SEARXNG_SECRET\" ] && export SEARXNG_SECRET && exec /usr/local/searxng/entrypoint.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
    deploy:
      replicas: ${TALARIA_SEARXNG:-1}
    volumes:
      - ./files/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - type: volume
        source: secrets
        target: /secrets
        read_only: true
        volume:
          subpath: searxng
    read_only: true
    tmpfs:
      - /etc/searxng:uid=977,gid=977
      - /var/cache/searxng:uid=977,gid=977
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s

  # --- profile demo: a stand-in model, so you can try Talaria with no API key ---
  demo-llm:
    profiles: [demo]
    image: *hermes-image
    entrypoint: ["/opt/hermes/.venv/bin/python", "-I", "/files/demo-llm.py"]
    user: "65534:65534"
    restart: unless-stopped
    volumes:
      - ./files:/files:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      start_interval: 1s

  # --- profile ollama: local models on this host (a GPU helps a lot) ---
  ollama:
    profiles: [ollama]
    image: docker.io/ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-65536}
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 2s

  # Downloads TALARIA_OLLAMA_PULL (for example llama3.2:3b) once
  ollama-pull:
    profiles: [ollama]
    image: docker.io/ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      M: ${TALARIA_OLLAMA_PULL:-}
    entrypoint: ["/bin/sh", "-c", "[ -z \"$$M\" ] || ollama pull \"$$M\""]

  # --- profile honcho: long-term memory (Honcho by Plastic Labs) ---
  honcho-db:
    profiles: [honcho]
    image: docker.io/pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    environment:
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: honcho
      POSTGRES_DB: honcho
    volumes:
      - honcho-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "honcho"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 1s

  honcho-migrate:
    profiles: [honcho]
    image: &honcho-image ghcr.io/plastic-labs/honcho:v3.6.0@sha256:eb906a2d251aa48b22347e4465b40785ea7a84e2bfd1105780416bf1f0121099
    depends_on:
      honcho-db:
        condition: service_healthy
    environment: &honcho-env
      DB_CONNECTION_URI: postgresql+psycopg://honcho:honcho@honcho-db:5432/honcho
      AUTH_USE_AUTH: "false"
      LLM_OPENAI_API_KEY: ${TALARIA_HONCHO_LLM_API_KEY:-none}
      LLM_OPENAI_BASE_URL: ${TALARIA_HONCHO_LLM_BASE_URL:-http://demo-llm:8000/v1}
      DERIVER_MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      SUMMARY_MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DIALECTIC_LEVELS__medium__MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DIALECTIC_LEVELS__high__MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      DIALECTIC_LEVELS__max__MODEL_CONFIG__MODEL: ${TALARIA_HONCHO_MODEL:-talaria-demo}
      EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__MODEL: ${TALARIA_EMBEDDINGS_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${TALARIA_EMBEDDINGS_BASE_URL:-http://honcho-embeddings:8080/v1}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY: ${TALARIA_EMBEDDINGS_API_KEY:-none}
      EMBEDDING_MODEL_CONFIG__DIMENSIONS_MODE: never
      EMBEDDING_VECTOR_DIMENSIONS: ${TALARIA_EMBEDDINGS_DIMENSIONS:-384}
      EMBEDDING_MAX_INPUT_TOKENS: "480"
      SENTRY_ENABLED: "false"
      METRICS_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      CACHE_ENABLED: "false"
      TIKTOKEN_CACHE_DIR: /tmp/tiktoken
    command: ["sh", "-c", "python scripts/provision_db.py && python scripts/configure_embeddings.py --yes"]

  honcho:
    profiles: [honcho]
    image: *honcho-image
    restart: unless-stopped
    depends_on:
      honcho-migrate:
        condition: service_completed_successfully
    environment: *honcho-env
    command: ["fastapi", "run", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "src/main.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 2s

  honcho-deriver:
    profiles: [honcho]
    image: *honcho-image
    restart: unless-stopped
    depends_on:
      honcho-migrate:
        condition: service_completed_successfully
    environment: *honcho-env
    command: ["python", "-m", "src.deriver"]

  # A small CPU embedding model (BAAI/bge-small-en-v1.5, 384 dimensions, about 1 GB of RAM). Leave this profile
  # off and set TALARIA_EMBEDDINGS_* to use a hosted embeddings API instead
  honcho-embeddings:
    profiles: [honcho-embeddings]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--hostname", "0.0.0.0", "--port", "8080", "--max-batch-tokens", "2048"]
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - honcho-embeddings:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      start_interval: 5s

volumes:
  secrets:
  hermes-data:
  plugin-src:
  hub-data:
  caddy-data:
  sandbox-work:
  ollama-data:
  honcho-db:
  honcho-embeddings:
