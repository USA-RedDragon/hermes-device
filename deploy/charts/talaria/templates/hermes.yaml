{{- $full := include "talaria.fullname" . -}}
{{- $rolling := .Values.hermes.rolling.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-hermes
  labels: {{- include "talaria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.hermes.persistence.accessMode }}]
  {{- with .Values.hermes.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.hermes.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-hermes
  labels: {{- include "talaria.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes
spec:
  replicas: 1
  {{- if $rolling }}
  # The new pod boots next to the old one as a standby: its gateway waits for the old gateway's lock and takes
  # over within a second of its exit. maxUnavailable 0 would deadlock: the old pod only stops once the new one
  # is ready, and the new one is ready only after the old one let go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "talaria.selector" (list . "hermes") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "talaria.selector" (list . "hermes") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        checksum/files: {{ include (print $.Template.BasePath "/files.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "talaria.pullSecrets" . | nindent 6 }}
      {{- if $rolling }}
      terminationGracePeriodSeconds: {{ .Values.hermes.rolling.terminationGracePeriodSeconds }}
      {{- if eq .Values.hermes.persistence.accessMode "ReadWriteOnce" }}
      # Both pods mount the ReadWriteOnce volume during the handover, so the new pod goes to the old pod's node
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {{- include "talaria.selector" (list . "hermes") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- else }}
      terminationGracePeriodSeconds: 120
      {{- end }}
      securityContext:
        # The image's hermes user
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # The device plugin from the talaria image, so client, plugin and protocol share one release
        - name: plugin
          image: {{ .Values.images.device }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["plugin", "install", "--dest", "/plugin-src/device"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext: &sc
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: plugin-src, mountPath: /plugin-src}
        # Device plugin, hub public key, Talaria settings in config.yaml
        - name: init
          image: {{ .Values.images.hermes }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/opt/hermes/.venv/bin/python", "-I", "/talaria/hermes-init.py"]
          env: &env
            - {name: HOME, value: /opt/data}
            - {name: HERMES_HOME, value: /opt/data}
            - {name: HERMES_WRITE_SAFE_ROOT, value: "/opt/data:/work"}
            - {name: TZ, value: {{ .Values.timeZone | quote }}}
            - {name: TALARIA_SECRETS_DIR, value: /secrets}
            - {name: TALARIA_USER, value: {{ .Values.auth.user | quote }}}
            - {name: TALARIA_SKILLS_SYNC, value: "1"}
            - {name: TALARIA_EXTRA_CONFIG, value: /secrets/hermes-extra.yaml}
            {{- if $rolling }}
            - {name: TALARIA_ROLLING, value: "1"}
            {{- end }}
            - {name: TALARIA_MODEL_BASE_URL, value: {{ include "talaria.modelBaseUrl" . | quote }}}
            - {name: TALARIA_MODEL, value: {{ include "talaria.modelName" . | quote }}}
            - {name: TALARIA_MODEL_CONTEXT, value: {{ .Values.model.contextLength | quote }}}
            {{- if or .Values.model.apiKey .Values.model.existingSecret }}
            - name: TALARIA_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.existingSecret | default (printf "%s-config" $full) }}
                  key: {{ ternary "api-key" "model-api-key" (not (empty .Values.model.existingSecret)) }}
            {{- end }}
            {{- range $k, $v := .Values.hermes.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext: *sc
          volumeMounts: &mounts
            - {name: data, mountPath: /opt/data}
            - {name: tmp, mountPath: /tmp}
            - {name: plugin-src, mountPath: /plugin-src, readOnly: true}
            - {name: files, mountPath: /talaria, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      containers:
        - name: gateway
          image: {{ .Values.images.hermes }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/opt/hermes/.venv/bin/hermes", "gateway", "run", "--no-supervise", "--external-supervisor"]
          workingDir: /opt/data
          env: *env
          ports:
            - {name: webapp, containerPort: 9120}
          {{- if $rolling }}
          # A warmed-up standby (gateway.standby on the volume) counts as started, so it can wait for the old pod's
          # gateway; only readiness gates the takeover
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -e /opt/data/gateway.standby || curl -fsS -m 5 -o /dev/null http://127.0.0.1:9120/api/health"]
            periodSeconds: 1
            timeoutSeconds: 6
            failureThreshold: 960
          {{- else }}
          startupProbe:
            httpGet: {path: /api/health, port: 9120}
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 150
          {{- end }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -e /opt/data/gateway.standby || curl -fsS -m 10 -o /dev/null http://127.0.0.1:9120/api/health"]
            periodSeconds: 30
            timeoutSeconds: 11
            failureThreshold: 5
          # 200 while serving and in the restart wait (approvals stay answerable), 503 while starting or stopping
          readinessProbe:
            httpGet: {path: /api/health, port: 9120}
            periodSeconds: 1
            timeoutSeconds: 5
            failureThreshold: 2
          {{- if $rolling }}
          lifecycle:
            preStop:
              exec:
                # Serve on until the new pod's gateway has warmed up and waits for the lock, then let SIGTERM
                # open the restart wait. A stop with no successor goes on after 2 minutes
                command: ["/bin/sh", "-c", "s=$(date +%s); while [ $(($(date +%s)-s)) -lt 120 ]; do m=$(stat -c %Y /opt/data/gateway.standby 2>/dev/null || echo 0); [ $m -ge $((s-1)) ] && exit 0; sleep 0.5; done"]
          {{- end }}
          resources: {{- toYaml .Values.hermes.resources | nindent 12 }}
          securityContext: *sc
          volumeMounts: *mounts
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ $full }}-hermes}
        - name: tmp
          emptyDir: {}
        - name: plugin-src
          emptyDir: {}
        - name: files
          configMap: {name: {{ $full }}-files}
        - name: secrets
          secret:
            secretName: {{ $full }}-config
            items:
              - {key: hub-signing-key, path: hub-signing-key}
              - {key: password, path: password}
              - {key: session-secret, path: session-secret}
              - {key: hermes-extra.yaml, path: hermes-extra.yaml}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-hermes
  labels: {{- include "talaria.labels" . | nindent 4 }}
spec:
  selector: {{- include "talaria.selector" (list . "hermes") | nindent 4 }}
  # During a handover the stopping pod keeps serving; Kubernetes routes to it while no new pod is ready
  publishNotReadyAddresses: false
  ports:
    - {name: webapp, port: 9120, targetPort: webapp}
