{{- $full := include "talaria.fullname" . -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $full }}-sandbox
  labels: {{- include "talaria.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.sandbox.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sandbox.persistence.size }}
---
# Where the agent runs commands for chats that are not on one of your computers. One connection per sandbox
# device: a second pod would replace the first one's, so it is replaced, not rolled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-sandbox
  labels: {{- include "talaria.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "talaria.selector" (list . "sandbox") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "talaria.selector" (list . "sandbox") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "talaria.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sandbox
          image: {{ .Values.images.sandbox }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: TALARIA_HUB_URL, value: "http://{{ $full }}-hub-internal:8081"}
            - {name: TALARIA_HUB_TOKEN_FILE, value: /secrets/token}
          resources: {{- toYaml .Values.sandbox.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: token, mountPath: /secrets, readOnly: true}
      volumes:
        - name: work
          persistentVolumeClaim: {claimName: {{ $full }}-sandbox}
        - name: tmp
          emptyDir: {}
        - name: token
          secret:
            secretName: {{ $full }}-config
            defaultMode: 0440
            items:
              - {key: sandbox-token, path: token}
