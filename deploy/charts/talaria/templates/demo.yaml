{{- if .Values.demo.enabled }}
{{- $full := include "talaria.fullname" . -}}
# A stand-in model with no API key, to try Talaria. It answers with a canned reply
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-demo-llm
  labels: {{- include "talaria.labels" . | nindent 4 }}
    app.kubernetes.io/component: demo-llm
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "talaria.selector" (list . "demo-llm") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "talaria.selector" (list . "demo-llm") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "talaria.pullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo-llm
          image: {{ .Values.images.hermes }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/opt/hermes/.venv/bin/python", "-I", "/talaria/demo-llm.py"]
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: files, mountPath: /talaria, readOnly: true}
      volumes:
        - name: files
          configMap: {name: {{ $full }}-files}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-demo-llm
  labels: {{- include "talaria.labels" . | nindent 4 }}
spec:
  selector: {{- include "talaria.selector" (list . "demo-llm") | nindent 4 }}
  ports:
    - {name: http, port: 8000, targetPort: http}
{{- end }}
