name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  patches:
    name: Patches
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Hermes
        run: |
          version=$(scripts/base-version.sh)
          echo "HERMES_VERSION=$version" >> "$GITHUB_ENV"
          echo "HERMES_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
          echo "Hermes $version" >> "$GITHUB_STEP_SUMMARY"
          git clone --quiet --depth 1 --branch "$version" -c advice.detachedHead=false \
            https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      - name: Apply patches
        run: scripts/apply-patches.sh "$HERMES_SRC" patches

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Hermes and its test dependencies
        working-directory: ${{ env.HERMES_SRC }}
        run: uv sync --locked --python 3.14 --extra all --extra anthropic --group dev --group test

      - name: Patch tests
        run: scripts/run-patch-tests.sh "$HERMES_SRC" patches

  hub-contract:
    name: Hub contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Hermes and hermes-hub
        run: |
          version=$(scripts/base-version.sh)
          echo "HERMES_AGENT_VERSION=$version" >> "$GITHUB_ENV"
          echo "HERMES_AGENT_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
          git clone --quiet --depth 1 --branch "$version" -c advice.detachedHead=false \
            https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"
          git clone --quiet --depth 1 https://github.com/USA-RedDragon/hermes-hub "$RUNNER_TEMP/hermes-hub"

      - name: Apply patches
        env:
          HERMES_VERSION: ${{ env.HERMES_AGENT_VERSION }}
        run: scripts/apply-patches.sh "$HERMES_AGENT_SRC" patches

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/hermes-hub/go.mod
          cache: false

      - name: Contract tests of hermes-hub against the patched tree
        working-directory: ${{ runner.temp }}/hermes-hub
        run: |
          go test -count=1 -v -run 'AgainstSource$' ./internal/gateway/ ./internal/device/ | tee "$RUNNER_TEMP/test.txt"
          for t in TestContractAgainstSource TestClientMethodsAgainstSource; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/test.txt" || { echo "::error::$t did not pass"; exit 1; }
          done

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hermes-patches:test

      - name: Device plugin tests in the patched image
        run: |
          git clone --quiet --depth 1 https://github.com/USA-RedDragon/hermes-device "$RUNNER_TEMP/hermes-device"
          docker run --rm --entrypoint /bin/sh -v "$RUNNER_TEMP/hermes-device:/src:ro" -e HERMES_AGENT_SRC=/opt/hermes \
            hermes-patches:test /src/scripts/test-plugin.sh
