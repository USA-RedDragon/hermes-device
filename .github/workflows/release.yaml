name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      # The default hub of talaria setup, as for the Firefox extension below.
      # The other parts of this repository have their own tag prefixes (hub/,
      # hermes/, aio/), so goreleaser gets this tag and the previous v* tag
      # instead of finding them itself. The plugin must report the tag's version
      # (v0.25.3 once shipped one that reported 0.25.2); the check fails the
      # release before anything is built.
      run-before: |
        scripts/check-plugin-version.sh "$GITHUB_REF_NAME"
        printf 'HUB_DEFAULT_URL=%s\n' "${{ vars.HUB_DEFAULT_URL }}" >> "$GITHUB_ENV"
        printf 'GORELEASER_CURRENT_TAG=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_ENV"
        printf 'GORELEASER_PREVIOUS_TAG=%s\n' "$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^")" >> "$GITHUB_ENV"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  firefox-extension:
    name: Firefox extension
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      WEB_EXT: web-ext@10.8.0
      EXT_DIR: ${{ github.workspace }}/firefox-extension
      SIGNED_DIR: ${{ github.workspace }}/firefox-signed
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Decide whether to sign
        id: plan
        env:
          HAVE_ISSUER: ${{ secrets.AMO_JWT_ISSUER != '' }}
          HAVE_SECRET: ${{ secrets.AMO_JWT_SECRET != '' }}
        run: |
          version=${TAG#v}
          sign=true
          if ! grep -Eq '^(0|[1-9][0-9]{0,8})(\.(0|[1-9][0-9]{0,8})){0,3}$' <<<"$version"; then
            echo "::notice title=Firefox extension not signed::$TAG is a pre-release or has build metadata. Firefox versions are one to four numbers, and no number for $TAG sorts before the final release, so the extension is signed only for final releases."
            sign=false
            version=
          elif [ "$HAVE_ISSUER" != true ] || [ "$HAVE_SECRET" != true ]; then
            echo "::notice title=Firefox extension not signed::The repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are not set, so the extension is linted but not signed, and this release has no .xpi or updates.json (docs/browser.md section 6.1)."
            sign=false
          elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx updates.json; then
            echo "::notice title=Firefox extension already published::$TAG already has updates.json."
            sign=false
          fi
          {
            echo "version=$version"
            echo "sign=$sign"
          } >> "$GITHUB_OUTPUT"

      - name: Build the extension
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          go run . browser extension --out "$EXT_DIR" ${VERSION:+--ext-version "$VERSION"}
          cat "$EXT_DIR/manifest.json"

      - name: Lint the extension
        run: npx --yes "$WEB_EXT" lint --source-dir "$EXT_DIR" --self-hosted

      - name: Reuse the last signed extension when it did not change
        id: carry
        if: steps.plan.outputs.sign == 'true'
        run: |
          prev=
          for tag in $(gh release list --limit 40 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$TAG" ] && continue
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx updates.json; then
              prev=$tag
              break
            fi
          done
          if [ -z "$prev" ]; then
            echo "carry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/prev"
          mkdir -p "$dir/files"
          gh release download "$prev" --dir "$dir" --pattern updates.json
          link=$(jq -r '[.addons[].updates[].update_link][0]' "$dir/updates.json")
          case "$link" in
            "https://github.com/$GH_REPO/releases/download/"*.xpi) ;;
            *) echo "::error::$prev updates.json links to $link"; exit 1 ;;
          esac
          curl -fsSL -o "$dir/prev.xpi" "$link"
          unzip -q "$dir/prev.xpi" -d "$dir/files"
          rm -rf "$dir/files/META-INF"
          same=true
          diff -rq -x manifest.json "$dir/files" "$EXT_DIR" || same=false
          [ "$(jq -S 'del(.version)' "$dir/files/manifest.json")" = "$(jq -S 'del(.version)' "$EXT_DIR/manifest.json")" ] || same=false
          if [ "$same" = true ]; then
            echo "::notice title=Firefox extension unchanged::The extension is the same as the one signed for $prev, so $TAG reuses it ($link) and does not ask addons.mozilla.org to sign it again."
            xpi="$dir/$(basename "$link")"
            mv "$dir/prev.xpi" "$xpi"
            gh release upload "$TAG" "$dir/updates.json" "$xpi" --clobber
          fi
          echo "carry=$same" >> "$GITHUB_OUTPUT"

      - name: Sign the extension on addons.mozilla.org (unlisted)
        if: steps.plan.outputs.sign == 'true' && steps.carry.outputs.carry != 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx --yes "$WEB_EXT" sign --channel unlisted --source-dir "$EXT_DIR" --artifacts-dir "$SIGNED_DIR"

      - name: Publish the signed extension and updates.json
        if: steps.plan.outputs.sign == 'true' && steps.carry.outputs.carry != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          shopt -s nullglob
          signed=("$SIGNED_DIR"/*.xpi)
          if [ "${#signed[@]}" -ne 1 ]; then
            echo "::error::expected one signed .xpi in $SIGNED_DIR, found ${#signed[@]}"
            exit 1
          fi
          name="talaria-firefox-$VERSION.xpi"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp "${signed[0]}" "$out/$name"
          unzip -l "$out/$name" | grep -Eq 'META-INF/(cose\.sig|mozilla\.rsa)' || { echo "::error::$name has no Mozilla signature"; exit 1; }
          got=$(unzip -p "$out/$name" manifest.json | jq -r .version)
          [ "$got" = "$VERSION" ] || { echo "::error::$name has version $got, want $VERSION"; exit 1; }
          id=$(jq -r .browser_specific_settings.gecko.id "$EXT_DIR/manifest.json")
          hash=$(sha256sum "$out/$name" | cut -d' ' -f1)
          jq -n --arg id "$id" --arg version "$VERSION" \
            --arg link "https://github.com/$GH_REPO/releases/download/$TAG/$name" \
            --arg hash "sha256:$hash" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' \
            > "$out/updates.json"
          cat "$out/updates.json"
          gh release upload "$TAG" "$out/$name" "$out/updates.json" --clobber

      # GoReleaser wrote the checksum file before the extension existed, so
      # this rewrites it over every archive and .xpi. hermes-device_ is the
      # same file under the name that talaria update of older installs reads.
      - name: Write the checksum files over all release files
        run: |
          dir="$RUNNER_TEMP/sums"
          mkdir -p "$dir"
          cd "$dir"
          gh release download "$TAG" --pattern '*.tar.gz' --pattern '*.zip' --pattern '*.xpi'
          shopt -s nullglob
          files=(*.tar.gz *.zip *.xpi)
          xpis=(*.xpi)
          [ "${#xpis[@]}" -gt 0 ] || echo "::notice title=No extension::$TAG has no .xpi, so the checksums cover the archives only."
          version=${TAG#v}
          sums="talaria_${version}_checksums.txt"
          sha256sum -- "${files[@]}" > "$sums"
          cat "$sums"
          cp "$sums" "hermes-device_${version}_checksums.txt"
          gh release upload "$TAG" "$sums" "hermes-device_${version}_checksums.txt" --clobber

      # The extension's version is bumped only when the extension changes, so
      # it can be older than the tag. Say so in the notes, once.
      - name: Note the extension version in the release notes
        run: |
          xpi=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".xpi"))][0] // empty')
          [ -n "$xpi" ] || exit 0
          marker='<!-- firefox-extension-note -->'
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in *"$marker"*) exit 0 ;; esac
          ext=${xpi#talaria-firefox-}
          ext=${ext%.xpi}
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n\n%s\n**Firefox extension:** this release has `%s` (extension version %s). The extension version can be older than the Talaria version: it is bumped only when the extension changes, and a release whose extension did not change reuses the last signed file. It works with this release.\n' "$body" "$marker" "$xpi" "$ext" > "$notes"
          gh release edit "$TAG" --notes-file "$notes"

  # Attests the release files that the release and firefox-extension jobs
  # uploaded. talaria update verifies these attestations.
  attest-files:
    name: Attest release files
    needs: [release, firefox-extension]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      MAX_RELEASE_AGE: 10800
    steps:
      - name: Refuse to attest an old release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          age=$(( $(date +%s) - $(date -d "$published" +%s) ))
          if [ "$age" -gt "$MAX_RELEASE_AGE" ]; then
            echo "::error::$TAG was published $age seconds ago. Re-running the attestation of an old release could attest files changed since, so this job attests only releases published in the last $MAX_RELEASE_AGE seconds."
            exit 1
          fi

      - name: Download the release files
        run: |
          dir="$RUNNER_TEMP/assets"
          mkdir -p "$dir"
          gh release download "$TAG" --dir "$dir" --pattern '*.tar.gz' --pattern '*.zip' --pattern 'talaria_*_checksums.txt' --pattern '*.xpi'
          cd "$dir"
          ls -l
          version=${TAG#v}
          sha256sum --check --strict "talaria_${version}_checksums.txt"
          [ "$(grep -c '\.\(tar\.gz\|zip\|xpi\)$' "talaria_${version}_checksums.txt")" = "$(ls -1 ./*.tar.gz ./*.zip ./*.xpi 2>/dev/null | wc -l)" ] || { echo "::error::the archives do not match the checksum file"; exit 1; }

      - name: Attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*

  attest-images:
    name: Attest container images
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      matrix:
        image:
          - ghcr.io/usa-reddragon/talaria
          - ghcr.io/usa-reddragon/talaria-sandbox
    env:
      IMAGE: ${{ matrix.image }}
      TAG: ${{ github.ref_name }}
      MAX_RELEASE_AGE: 10800
    steps:
      - name: Refuse to attest an old release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          age=$(( $(date +%s) - $(date -d "$published" +%s) ))
          if [ "$age" -gt "$MAX_RELEASE_AGE" ]; then
            echo "::error::$TAG was published $age seconds ago. Re-running the attestation of an old release could attest files changed since, so this job attests only releases published in the last $MAX_RELEASE_AGE seconds."
            exit 1
          fi

      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Find the image digest
        id: digest
        run: |
          digest=sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" | sha256sum | cut -d' ' -f1)
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
