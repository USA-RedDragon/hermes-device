name: All-in-one image

# A tag aio/vX.Y.Z builds deploy/aio/Dockerfile for amd64 and arm64, pushes
# ghcr.io/usa-reddragon/talaria-aio:vX.Y.Z and :latest, signs it keyless with
# cosign and creates the GitHub release aio/vX.Y.Z (never marked latest: the
# latest release is the talaria daemon's, which auto-update reads). Run it by
# hand on a tag to build again. Bare v* tags are daemon releases, not this.

on:
  push:
    tags:
      - "aio/v*"
  pull_request:
    paths:
      - deploy/aio/**
      - deploy/compose/files/**
      - .github/workflows/aio.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usa-reddragon/talaria-aio

jobs:
  # A pull request or a run by hand on a branch builds both platforms and pushes nothing.
  build:
    name: Build (no push)
    if: "!startsWith(github.ref, 'refs/tags/aio/v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/aio/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

  image:
    name: Image
    if: startsWith(github.ref, 'refs/tags/aio/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image tag
        env:
          REF: ${{ github.ref_name }}
        run: echo "TAG=${REF#aio/}" >> "$GITHUB_ENV"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image installs a Debian package, so arm64 builds under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Base image
        id: base
        run: echo "name=$(sed -n 's/^ARG HERMES_IMAGE=\([^@]*\).*/\1/p' deploy/aio/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/aio/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=Talaria all-in-one
            org.opencontainers.image.description=Talaria (hub, Hermes Agent with the Talaria patches, sandbox, login) in one container. Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research.
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=USA-RedDragon
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}
          # ghcr shows the index annotations on the package page of a multi-arch image.
          annotations: |
            index:org.opencontainers.image.title=Talaria all-in-one
            index:org.opencontainers.image.description=Talaria (hub, Hermes Agent with the Talaria patches, sandbox, login) in one container. Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.vendor=USA-RedDragon

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE:$TAG@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          TAG=${REF#aio/}
          {
            echo "Image: \`$IMAGE:$TAG@$DIGEST\` (also \`$IMAGE:latest\`)"
            echo
            echo "Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research."
          } > "$RUNNER_TEMP/notes.md"
          gh release view "$REF" > /dev/null 2>&1 && gh release edit "$REF" --latest=false --notes-file "$RUNNER_TEMP/notes.md" \
            || gh release create "$REF" --verify-tag --latest=false --title "All-in-one image $TAG" --notes-file "$RUNNER_TEMP/notes.md"
