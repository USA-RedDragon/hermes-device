name: Hub Update prices

# Refreshes hub/internal/claudecode/prices.json, the Claude part of LiteLLM's
# model price list that ccusage also uses, so that the hub never fetches it
# at run time. The job runs no repository code: it fetches the list, keeps
# the Claude entries and their five token prices with jq, and commits the
# file when it changed.

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      URL: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
      FILE: hub/internal/claudecode/prices.json
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/prices.json" "$URL"
          jq -S 'with_entries(select(.key | test("^(anthropic/)?claude-")))
            | map_values({input_cost_per_token, output_cost_per_token, cache_creation_input_token_cost,
                cache_creation_input_token_cost_above_1hr, cache_read_input_token_cost} | with_entries(select(.value | type == "number")))
            | with_entries(select(.value.input_cost_per_token != null))' "${RUNNER_TEMP}/prices.json" > "${RUNNER_TEMP}/claude.json"
          if [[ $(jq 'length' "${RUNNER_TEMP}/claude.json") -lt 5 ]]; then
            echo "::error::the LiteLLM list has fewer than 5 Claude models; keeping the old file"
            exit 1
          fi
          cp "${RUNNER_TEMP}/claude.json" "$FILE"

      - env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE"; then
            echo "prices unchanged"
            exit 0
          fi
          name="${APP_SLUG}[bot]"
          git config user.name "$name"
          git config user.email "$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)+${name}@users.noreply.github.com"
          git add -- "$FILE"
          git commit -m "hub: claudecode: update the LiteLLM price list"
          for attempt in 1 2 3; do
            git push origin "HEAD:${BRANCH}" && exit 0
            git pull --rebase --quiet origin "$BRANCH"
          done
          exit 1
