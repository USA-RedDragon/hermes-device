name: Docs

# One site for all of Talaria: docs/ with hub/docs, hub/README.md and
# hermes/README.md (docs/nav.md lists the pages), published to GitHub Pages.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the generated parts of the docs
        run: go run github.com/USA-RedDragon/docgen@v0.0.0-20261109224744-ef1962a8c996 check -diff
      # hub/ is its own Go module with its own .docgen.yaml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: Check the generated parts of the hub docs
        working-directory: hub
        run: go run github.com/USA-RedDragon/docgen@v0.0.0-20261109224744-ef1962a8c996 check -diff
      - name: Install pandoc
        run: docs/site/install-pandoc.sh "$RUNNER_TEMP/pandoc" >>"$GITHUB_PATH"
      - name: Build the docs site
        run: docs/site/build.sh
      - name: Check the links of the docs site
        run: docs/site/check-links.py artifacts/docs-site
      - name: Upload the docs site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: artifacts/docs-site
          retention-days: 14

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docgen
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pandoc
        run: docs/site/install-pandoc.sh "$RUNNER_TEMP/pandoc" >>"$GITHUB_PATH"
      - name: Build the docs site
        run: docs/site/build.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/docs-site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
