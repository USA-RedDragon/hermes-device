name: Hermes release

# Each change to hermes/Dockerfile, hermes/patches or hermes/scripts on main,
# after the tests pass, becomes image tag v<upstream>-p<n> (v0.23.1-p31,
# v0.23.1-p32, then v0.24.0-p1 after Renovate moves the base), with the git tag
# and GitHub release hermes/v<upstream>-p<n> (never marked latest: the latest
# release is the talaria daemon's, which auto-update reads).
# Run it by hand with publish off (the default) for a dry run: it prints the
# next tag and builds both platforms without pushing. With publish on it
# releases HEAD again.
# The image is ghcr.io/usa-reddragon/talaria-hermes, also tagged latest-stable.

on:
  push:
    branches:
      - main
    paths:
      - hermes/Dockerfile
      - hermes/patches/**
      - hermes/scripts/**
      - .github/workflows/hermes-release.yaml
      - .github/workflows/hermes-test.yaml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images and make the release. Off is a dry run.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/usa-reddragon/talaria-hermes

defaults:
  run:
    working-directory: hermes

jobs:
  test:
    name: Test
    uses: ./.github/workflows/hermes-test.yaml

  version:
    name: Version
    needs: test
    runs-on: ubuntu-24.04
    # contents: write is for the git tag, which is made here, before any image moves.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.next.outputs.release }}
      tag: ${{ steps.next.outputs.tag }}
      upstream: ${{ steps.next.outputs.upstream }}
      push: ${{ steps.next.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Next release
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          upstream=$(scripts/base-version.sh)
          last=$(git tag -l "hermes/$upstream-p*" | grep -E "^hermes/$upstream-p[0-9]+$" | sort -V | tail -n1 || true)
          release=true
          if [ -n "$last" ] && [ "$MANUAL" != true ] && git diff --quiet "$last" HEAD -- Dockerfile patches scripts; then
            release=false
            echo "Nothing changed since $last" >> "$GITHUB_STEP_SUMMARY"
          fi
          n=$(( ${last##*-p} + 0 ))
          tag="$upstream-p$(( n + 1 ))"
          # The git tag comes first: if it cannot be made, nothing is pushed and the
          # image tag never moves. GITHUB_TOKEN may only create a ref at a commit whose
          # .github/workflows matches the tip of main (anywhere else it gets 403, as it
          # does for a tag that would carry workflow changes), so the tag goes on the tip
          # of main. When the tip changed the image inputs after this commit, its own run
          # releases it and this one stops.
          if [ "$release" = true ] && [ "$PUBLISH" = true ]; then
            git fetch --no-tags origin main
            tip=$(git rev-parse FETCH_HEAD)
            if [ "$tip" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" "$tip" -- Dockerfile patches scripts; then
              release=false
              echo "Main moved on with newer image changes ($tip); its run releases them." >> "$GITHUB_STEP_SUMMARY"
            else
              gh api -X POST "repos/$GH_REPO/git/refs" --field "ref=refs/tags/hermes/$tag" --field "sha=$tip" > /dev/null
            fi
          fi
          {
            echo "upstream=$upstream"
            echo "tag=$tag"
            echo "release=$release"
            echo "push=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Last release: ${last:-none}. Next: image tag $tag, git tag hermes/$tag (publish: $PUBLISH)" >> "$GITHUB_STEP_SUMMARY"
          [ "$release" = true ] && echo "Release $tag on Hermes $upstream" >> "$GITHUB_STEP_SUMMARY" || true

  image:
    name: Image
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      UPSTREAM: ${{ needs.version.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: needs.version.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # An image tag is never overwritten: a published tag is what nodes run.
      - name: Refuse an existing image tag
        if: needs.version.outputs.push == 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; not overwriting it"
            exit 1
          fi

      # New layers are zstd. The upstream layers keep their gzip compression and
      # digests (no force-compression), so nodes reuse the upstream layers they
      # already have and a release pushes only the patched files.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hermes
          platforms: linux/amd64,linux/arm64
          pull: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest-stable
          labels: |
            org.opencontainers.image.title=Talaria Hermes
            org.opencontainers.image.description=Hermes Agent with the Talaria patches. Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research.
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=USA-RedDragon
            org.opencontainers.image.base.name=docker.io/nousresearch/hermes-agent:${{ env.UPSTREAM }}
          # ghcr shows the index annotations on the package page of a multi-arch image.
          annotations: |
            index:org.opencontainers.image.title=Talaria Hermes
            index:org.opencontainers.image.description=Hermes Agent with the Talaria patches. Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MIT
            index:org.opencontainers.image.vendor=USA-RedDragon
          outputs: type=image,push=${{ needs.version.outputs.push }},oci-mediatypes=true,compression=zstd,compression-level=19

      # GitHub artifact attestations are not available for private repositories of a
      # user account, so the image is signed keyless with cosign (Sigstore, GitHub OIDC)
      # next to BuildKit's in-image provenance and SBOM.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.version.outputs.push == 'true'

      - name: Sign the image
        if: needs.version.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "$IMAGE:$TAG@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [version, image]
    if: needs.version.outputs.push == 'true' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          {
            echo "Hermes Agent $UPSTREAM with these patches:"
            echo
            for p in patches/*.patch; do
              echo "- $(basename "$p" .patch): $(sed -n 's/^Subject: \(\[PATCH[^]]*\] \)\{0,1\}//p' "$p" | head -n1)"
            done
            echo
            echo "Image: \`$IMAGE:$TAG\`"
            echo
            echo "Built on Hermes Agent by Nous Research (MIT). Not affiliated with or endorsed by Nous Research."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "hermes/$TAG" --verify-tag --latest=false --title "Hermes image $TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # An image that failed leaves no tag behind, or the next run would see "nothing
  # changed since" that tag and skip the change.
  untag:
    name: Remove the unused tag
    needs: [version, image]
    if: always() && needs.version.outputs.push == 'true' && needs.version.outputs.release == 'true' && needs.image.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh api -X DELETE "repos/$GH_REPO/git/refs/tags/hermes/$TAG"
