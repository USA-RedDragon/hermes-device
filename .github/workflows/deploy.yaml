name: Deploy kit

# Checks the install kit in deploy/: the compose file, the Helm chart, the
# Unraid template and the setup scripts.

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/deploy.yaml
  push:
    branches:
      - main
    paths:
      - deploy/**
      - .github/workflows/deploy.yaml

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the install files
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copies of the setup scripts match
        run: hack/check-sync.sh
      - name: Setup script tests
        run: python3 -I hack/test_hermes_init.py
      - name: Shell scripts
        run: |
          shellcheck -s sh compose/files/init.sh aio/rootfs/etc/cont-init.d/10-talaria hack/check-sync.sh hack/pin.sh \
            aio/rootfs/etc/s6-overlay/s6-rc.d/talaria-searxng/run aio/rootfs/etc/s6-overlay/s6-rc.d/talaria-searxng/finish
      - name: Compose file
        run: |
          cp compose/.env.example compose/.env
          docker compose -f compose/compose.yaml config -q
          COMPOSE_PROFILES=demo,ollama,honcho,honcho-embeddings docker compose -f compose/compose.yaml config -q
      - name: Helm chart
        run: |
          # The packaged common library in charts/ matches Chart.lock
          helm dependency list charts/talaria | awk 'NR > 1 && NF && $NF != "ok" { print; bad = 1 } END { exit bad }'
          helm lint charts/talaria --set publicUrl=http://localhost:8080 --set demo.enabled=true
          for kv in 1.29.0 1.35.0; do
            helm template t charts/talaria --kube-version "$kv" --set publicUrl=http://localhost:8080 --set demo.enabled=true > /dev/null
          done
          helm template t charts/talaria --set publicUrl=https://talaria.example.com --set ingress.enabled=true \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw' \
            --api-versions gateway.networking.k8s.io/v1/HTTPRoute > /dev/null
          helm template t charts/talaria --set publicUrl=https://talaria.example.com --set auth.mode=oidc \
            --set auth.oidc.issuerUrl=https://id.example.com --set auth.oidc.clientId=c \
            --set 'auth.oidc.users[0].sub=s' --set 'auth.oidc.users[0].name=admin' \
            --set hub.store.driver=postgres --set hub.store.existingSecret=db --set hub.replicas=2 > /dev/null
          helm template t charts/talaria --set publicUrl=http://localhost:8080 --set searxng.enabled=false \
            --set hermes.editorBridge.enabled=false --set hermes.rolling.enabled=false > /dev/null
          # The containers of each pod: the hub serves its port itself, and the agent's pod runs no Hermes dashboard
          got=$(helm template t charts/talaria --kube-version 1.35.0 --set publicUrl=http://localhost:8080 \
            | yq 'select(.kind == "Deployment") | [.metadata.name, ([.spec.template.spec.containers[].name] | join(","))] | join("=")' \
            | grep = | sort | xargs)
          want="t-talaria-hermes=acp-host,gateway t-talaria-hub=hub t-talaria-sandbox=sandbox t-talaria-searxng=searxng"
          [ "$got" = "$want" ] || { echo "containers: $got, want $want"; exit 1; }
          # The editor bridge's binary: an image volume from 1.35, an init container's copy below
          helm template t charts/talaria --kube-version 1.35.0 --set publicUrl=http://localhost:8080 | grep 'reference: ghcr.io/usa-reddragon/talaria:' > /dev/null
          helm template t charts/talaria --kube-version 1.34.0 --set publicUrl=http://localhost:8080 | grep 'copy-self' > /dev/null
      - name: Unraid template
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils
          xmllint --noout aio/unraid/talaria.xml
