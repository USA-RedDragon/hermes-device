name: Hub Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - hub/**
      - .github/workflows/hub-test.yaml
  push:
    branches:
      - main
    paths:
      - hub/**
      - .github/workflows/hub-test.yaml

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

env:
  CDP_TIMEOUT_MS: "120000"

defaults:
  run:
    working-directory: hub

jobs:
  backend-race-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HUB_TEST_POSTGRES_DSN: postgres://hub:hub@localhost:5432/hub?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Allow browser sandboxes
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: go generate ./...

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: Race tests
        run: |
          go test ./... -race

  backend-unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Allow browser sandboxes
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: go generate ./...

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: Unit tests
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/vakenbolt/go-test-report@latest
          env CGO_ENABLED=0 go test -v ./... 2>&1 > out.txt || true
          env CGO_ENABLED=0 go test -v ./... -json 2>&1 > json-out.txt || true
          cat out.txt | go-junit-report -out report.xml -iocopy
          cat json-out.txt | go-test-report -o report.html

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: "hub/report.xml"
          require_tests: true
          check_retries: true
          detailed_summary: true
          fail_on_failure: true
          token: ${{ secrets.GITHUB_TOKEN }}
          check_name: Hub Backend Unit Tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-report-xml
          path: hub/report.xml
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-report-html
          path: hub/report.html
          if-no-files-found: error
          retention-days: 30

  backend-unit-tests-coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      HUB_TEST_POSTGRES_DSN: postgres://hub:hub@localhost:5432/hub?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Allow browser sandboxes
        working-directory: .
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: go generate ./...

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: Unit tests
        run: |
          env CGO_ENABLED=0 go test -v ./... -coverprofile coverage.raw -coverpkg=./... -covermode atomic
          grep -v -e '_configulator\.go:' coverage.raw > coverage.out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: hub/coverage.out
          if-no-files-found: error
          retention-days: 30

  coverage:
    needs: backend-unit-tests-coverage
    permissions:
      contents: read
      pull-requests: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/coverage.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      artifact: backend-coverage
      file: coverage.out
      working-directory: hub
      strip-prefix: github.com/USA-RedDragon/talaria/hub/
      app-id: ${{ vars.AUTO_COMMIT_APP_ID }}
    secrets:
      app-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
