name: Plugins release

# Push a tag plugins/v<major>.<minor>.<patch> to release: the tests run again, then the GitHub release
# plugins/vX.Y.Z (never marked latest: the latest release is the talaria daemon's, which auto-update reads) gets a
# tarball of the plugin directories.

on:
  push:
    tags: ["plugins/v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/plugins-test.yaml

  release:
    name: GitHub release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: plugins
        run: |
          version=${TAG#plugins/}
          prev=$(git tag -l 'plugins/v*' --sort=-version:refname | grep -vx "$TAG" | head -n1 || true)
          mkdir dist
          tar -czf "dist/talaria-plugins-$version.tar.gz" --exclude=__pycache__ \
            subagent-routes project-memory scripts/install-plugin.sh .hermes-version README.md
          gh release create "$TAG" --verify-tag --latest=false --generate-notes ${prev:+--notes-start-tag "$prev"} \
            --title "Plugins $version" "dist/talaria-plugins-$version.tar.gz"
