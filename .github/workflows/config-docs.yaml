name: Config docs

# Device daemon only: changes to the other parts of the repository do not run it.
on:
  pull_request:
    paths-ignore:
      - deploy/**
      - docs/**
      - hub/**
      - hermes/**
      - README.md
      - .github/workflows/aio.yaml
      - .github/workflows/deploy.yaml
      - .github/workflows/docs.yaml
  push:
    branches:
      - main
    paths-ignore:
      - deploy/**
      - docs/**
      - hub/**
      - hermes/**
      - README.md
      - .github/workflows/aio.yaml
      - .github/workflows/deploy.yaml
      - .github/workflows/docs.yaml

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  config-docs:
    permissions:
      contents: read
    uses: USA-RedDragon/reusable-actions/.github/workflows/configulator-docs.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      dir: internal/config
      type: Config
      env-prefix: TALARIA_
      app-id: ${{ vars.AUTO_COMMIT_APP_ID }}
    secrets:
      app-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
