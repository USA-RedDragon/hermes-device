name: Hub Config docs

on:
  pull_request:
    paths:
      - hub/**
      - .github/workflows/hub-config-docs.yaml
  push:
    branches:
      - main
    paths:
      - hub/**
      - .github/workflows/hub-config-docs.yaml

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  config-docs:
    permissions:
      contents: read
    uses: USA-RedDragon/reusable-actions/.github/workflows/configulator-docs.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      dir: internal/config
      type: Config
      env-prefix: HUB_
      working-directory: hub
      go-version-file: hub/go.mod
      app-id: ${{ vars.AUTO_COMMIT_APP_ID }}
    secrets:
      app-key: ${{ secrets.AUTO_COMMIT_APP_KEY }}
