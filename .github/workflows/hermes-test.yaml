name: Hermes test

on:
  pull_request:
    paths:
      - hermes/**
      - hub/internal/gateway/**
      - hub/internal/device/**
      - plugin/**
      - scripts/test-plugin.sh
      - .github/workflows/hermes-test.yaml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: hermes

jobs:
  patches:
    name: Patches
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The patches ship in a public image and their headers are public, so they
      # carry the GitHub noreply author, never a personal address.
      - name: Patch authors
        run: |
          bad=$(grep -L '^From: USA-RedDragon <USA-RedDragon@users.noreply.github.com>$' patches/*.patch upstream/*/*.patch || true)
          if [ -n "$bad" ]; then
            for p in $bad; do echo "::error file=$p::author is not USA-RedDragon <USA-RedDragon@users.noreply.github.com>; set it with sed or git format-patch from a noreply identity"; done
            exit 1
          fi

      - name: Release planning
        run: scripts/test-next-release.sh

      - name: Check out Hermes
        run: |
          version=$(scripts/base-version.sh)
          echo "HERMES_VERSION=$version" >> "$GITHUB_ENV"
          echo "HERMES_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
          echo "Hermes $version" >> "$GITHUB_STEP_SUMMARY"
          git clone --quiet --depth 1 --branch "$version" -c advice.detachedHead=false \
            https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      - name: Apply patches
        run: scripts/apply-patches.sh "$HERMES_SRC" patches

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install Hermes and its test dependencies
        working-directory: ${{ env.HERMES_SRC }}
        run: uv sync --locked --python 3.14 --extra all --extra anthropic --group dev --group test

      - name: Patch tests
        run: scripts/run-patch-tests.sh "$HERMES_SRC" patches

  hub-contract:
    name: Hub contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release planning
        run: scripts/test-next-release.sh

      - name: Check out Hermes
        run: |
          version=$(scripts/base-version.sh)
          echo "HERMES_AGENT_VERSION=$version" >> "$GITHUB_ENV"
          echo "HERMES_AGENT_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"
          git clone --quiet --depth 1 --branch "$version" -c advice.detachedHead=false \
            https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      - name: Apply patches
        env:
          HERMES_VERSION: ${{ env.HERMES_AGENT_VERSION }}
        run: scripts/apply-patches.sh "$HERMES_AGENT_SRC" patches

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum

      - name: Contract tests of the hub against the patched tree
        working-directory: hub
        run: |
          go test -count=1 -v -run 'AgainstSource$' ./internal/gateway/ ./internal/device/ | tee "$RUNNER_TEMP/test.txt"
          for t in TestContractAgainstSource TestClientMethodsAgainstSource; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/test.txt" || { echo "::error::$t did not pass"; exit 1; }
          done

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hermes
          platforms: linux/amd64,linux/arm64
          pull: true
          push: false

      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hermes
          platforms: linux/amd64
          load: true
          tags: talaria-hermes:test

      - name: Device plugin tests in the patched image
        run: |
          docker run --rm --entrypoint /bin/sh -v "$GITHUB_WORKSPACE:/src:ro" -e HERMES_AGENT_SRC=/opt/hermes \
            talaria-hermes:test /src/scripts/test-plugin.sh
