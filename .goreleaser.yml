---
version: 2

project_name: hermes-device

release:
  github:
    owner: USA-RedDragon
    name: "{{ .ProjectName }}"

dockers_v2:
  - images:
      - "ghcr.io/usa-reddragon/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.url": "https://github.com/USA-RedDragon/{{ .ProjectName }}"
      "org.opencontainers.image.source": "https://github.com/USA-RedDragon/{{ .ProjectName }}"
    flags:
      - "--pull"
  - id: sandbox
    dockerfile: Dockerfile.sandbox
    images:
      - "ghcr.io/usa-reddragon/{{ .ProjectName }}-sandbox"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}-sandbox"
      "org.opencontainers.image.description": "Agent sandbox that runs hermes-device run as a service device"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.url": "https://github.com/USA-RedDragon/{{ .ProjectName }}"
      "org.opencontainers.image.source": "https://github.com/USA-RedDragon/{{ .ProjectName }}"
    flags:
      - "--pull"

builds:
  - main: .
    binary: "{{ .ProjectName }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
    flags:
      - -trimpath

archives:
  - formats: [tar.gz]

milestones:
  - close: true
