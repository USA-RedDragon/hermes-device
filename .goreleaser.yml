---
version: 2

project_name: talaria

release:
  github:
    owner: USA-RedDragon
    name: talaria

dockers_v2:
  - ids: [talaria]
    images:
      - "ghcr.io/usa-reddragon/{{ .ProjectName }}"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.url": "https://github.com/USA-RedDragon/talaria"
      "org.opencontainers.image.source": "https://github.com/USA-RedDragon/talaria"
    flags:
      - "--pull"
  - id: sandbox
    ids: [talaria]
    dockerfile: Dockerfile.sandbox
    images:
      - "ghcr.io/usa-reddragon/{{ .ProjectName }}-sandbox"
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}-sandbox"
      "org.opencontainers.image.description": "Agent sandbox that runs talaria run as a service device"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.url": "https://github.com/USA-RedDragon/talaria"
      "org.opencontainers.image.source": "https://github.com/USA-RedDragon/talaria"
    flags:
      - "--pull"

builds:
  - id: talaria
    main: .
    binary: talaria
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.hubURL={{ envOrDefault "HUB_DEFAULT_URL" "" }}
    flags:
      - -trimpath

  # The same program under its name before the rename, for the archives
  # that auto-update of releases up to v0.25.x looks for (v0.18 and older
  # read only these). Kept until the removal in docs/releases.md.
  - id: hermes-device
    main: .
    binary: hermes-device
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: riscv64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.hubURL={{ envOrDefault "HUB_DEFAULT_URL" "" }}
    flags:
      - -trimpath

archives:
  - id: talaria
    ids: [talaria]
    formats: [tar.gz]
    name_template: 'talaria_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
  - id: hermes-device
    ids: [hermes-device]
    formats: [tar.gz]
    name_template: 'hermes-device_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'

# talaria_ matches the archives. The workflow rewrites this file over the
# .xpi too and publishes a copy as hermes-device_<version>_checksums.txt for
# talaria update of older installs.
checksum:
  name_template: "talaria_{{ .Version }}_checksums.txt"

milestones:
  - close: true
