<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Hermes Hub</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/highlight.min.js" defer></script>
<script src="/static/markdown.js" defer></script>
<script src="/static/memory.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside id="side" class="side" aria-label="Chats">
    <div class="side-head">
      <span class="brand">Hermes</span>
      <button id="newchat" class="primary" type="button">New chat</button>
    </div>
    <div id="newon-row" class="newon-row" hidden><button id="newon" class="link" type="button">New chat on a computer</button></div>
    <div class="search"><input id="search" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></div>
    <nav id="sessions" class="sessions"></nav>
    <a id="memnav" class="memnav" href="#/memory" hidden><span class="memdot" aria-hidden="true"></span>Memory<span id="memcount" class="memcount" title="Changes waiting for approval" hidden></span></a>
    <details id="prefs" class="prefs" hidden>
      <summary>Settings</summary>
      <div class="prefs-body">
        <h2>Computers</h2>
        <p class="hint">Computers where Hermes can run commands and change files for you. To connect one, run <code>hermes-device login</code> on it.</p>
        <div id="devices" aria-live="polite"></div>
      </div>
    </details>
    <div class="side-foot">
      <span id="who" class="who"></span>
      <button id="logout" class="ghost" type="button">Log out</button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <section class="main">
    <header class="bar">
      <button id="menu" class="icon menu" type="button" aria-label="Show chats">&#9776;</button>
      <div class="title"><span id="title">Hermes</span><span id="subtitle" class="sub"></span><button id="place" class="place" type="button" hidden></button></div>
      <button id="stop" class="danger" type="button" hidden>Stop</button>
    </header>
    <details id="info" class="info" hidden>
      <summary id="infoline" title="Show model and thinking settings"></summary>
      <div class="info-body">
        <label>Model <select id="model"></select></label>
        <label id="effort-row">Thinking <select id="effort" title="How long the model thinks before it replies"></select></label>
        <div id="settings-note" class="status" aria-live="polite"></div>
      </div>
    </details>
    <div id="banner" class="banner" hidden></div>
    <div id="placenote" class="placenote" hidden></div>
    <div id="welcome" class="welcome">
      <p>Pick a chat, or start a new one.</p>
    </div>
    <div id="memory" class="memory" hidden></div>
    <div id="log" class="log" aria-live="polite" hidden></div>
    <form id="composer" class="composer" hidden>
      <div id="chips" class="chips" aria-label="Attachments" hidden></div>
      <div class="composer-row">
        <button id="attach" class="icon attach" type="button" aria-label="Attach files" title="Attach files"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg></button>
        <input id="files" type="file" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message Hermes" aria-label="Message"></textarea>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
    </form>
  </section>
</div>
<dialog id="picker" class="picker" aria-labelledby="picker-title"></dialog>
</body>
</html>
