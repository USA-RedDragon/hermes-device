<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talaria">
<title>Talaria</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/highlight.min.js" defer></script>
<script src="/static/markdown.js" defer></script>
<script src="/static/memory.js" defer></script>
<script src="/static/insights.js" defer></script>
<script src="/static/notify.js" defer></script>
<script src="/static/claude.js" defer></script>
<script src="/static/claudecode.js" defer></script>
<script src="/static/activity.js" defer></script>
<script src="/static/settings.js" defer></script>
<script src="/static/scheduled.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="app" class="app act-closed act-none">
  <aside id="side" class="side" aria-label="Chats">
    <div class="side-head">
      <span class="brand">Talaria</span>
      <button id="searchbtn" class="ghost ib" type="button" aria-label="Search chats" title="Search chats (Ctrl+K)" aria-expanded="false" aria-controls="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button id="newchat" class="primary ib" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="newon-row" class="newon-row" hidden><button id="newon" class="link" type="button">New chat on a computer</button></div>
    <div id="searchbox" class="search" hidden><input id="search" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off"></div>
    <nav id="sessions" class="sessions"></nav>
    <a id="schednav" class="memnav schednav" href="#/scheduled" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Scheduled<span id="schedcount" class="schedcount"></span></a>
    <a id="memnav" class="memnav" href="#/memory" hidden><span class="memdot" aria-hidden="true"></span>Memory<span id="memcount" class="memcount" title="Changes waiting for approval" hidden></span></a>
    <div class="side-foot">
      <span id="who" class="who"></span>
      <a id="usagenav" class="ghost ib" href="#/usage" aria-label="Usage" title="Usage" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a>
      <button id="gearbtn" class="ghost ib gear" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span id="geardot" class="badge" aria-hidden="true" hidden></span></button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <section class="main">
    <header class="bar">
      <button id="menu" class="icon menu" type="button" aria-label="Show chats">&#9776;</button>
      <div class="title"><span id="title">Talaria</span><span id="subtitle" class="sub"></span><button id="place" class="place" type="button" hidden></button></div>
      <div id="tok" class="tok" title="Tokens of this chat's own turns. Subagents and background prompts count apart, in Activity." hidden><span id="tokturn"></span><span id="toksub" class="tsub"></span></div>
      <button id="filesbtn" type="button" hidden title="See this chat's folder and what Talaria changed">Files</button>
      <button id="stop" class="danger" type="button" hidden>Stop</button>
      <button id="actbtn" class="actbtn" type="button" aria-expanded="false" aria-controls="act" aria-label="Activity" hidden><span class="lbl">Activity</span><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg><span id="actcount" class="count" hidden>0</span></button>
    </header>
    <details id="info" class="info" hidden>
      <summary id="infoline" title="Show model and thinking settings"></summary>
      <div class="info-body">
        <label>Model <select id="model"></select></label>
        <label id="effort-row">Thinking <select id="effort" title="How long the model thinks before it replies"></select></label>
        <div id="settings-note" class="status" aria-live="polite"></div>
      </div>
    </details>
    <div id="banner" class="banner" hidden></div>
    <div id="placenote" class="placenote" hidden></div>
    <div id="claudenote" class="placenote" aria-live="polite" hidden></div>
    <div id="welcome" class="welcome">
      <p>Pick a chat, or start a new one.</p>
    </div>
    <div id="memory" class="memory" hidden></div>
    <div id="usage" class="memory" hidden></div>
    <div id="scheduled" class="sched" hidden></div>
    <div id="log" class="log" aria-live="polite" hidden></div>
    <form id="composer" class="composer" hidden>
      <div id="chips" class="chips" aria-label="Attachments" hidden></div>
      <div class="composer-row">
        <button id="attach" class="icon attach" type="button" aria-label="Attach files" title="Attach files"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg></button>
        <input id="files" type="file" multiple hidden>
        <textarea id="input" rows="1" placeholder="Message Talaria" aria-label="Message"></textarea>
        <button id="send" class="primary" type="submit">Send</button>
      </div>
    </form>
  </section>
  <aside id="act" class="act" aria-label="Activity">
    <div class="act-head">
      <div class="tabs" role="tablist">
        <button id="tab-sub" type="button" role="tab" aria-selected="true">Subagents<span id="c-sub" class="c"></span></button>
        <button id="tab-bg" type="button" role="tab" aria-selected="false">Background<span id="c-bg" class="c"></span></button>
      </div>
      <button id="actclose" class="ghost" type="button" aria-label="Close activity">&#x2715;</button>
    </div>
    <div id="actsum" class="act-sum"></div>
    <div id="actbody" class="act-body"></div>
  </aside>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="picker" class="picker" aria-labelledby="picker-title"></dialog>
<dialog id="settings" class="settings" aria-labelledby="settings-title">
  <div class="set-head"><button id="setback" class="ghost ib" type="button" aria-label="Back to Settings" title="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><h1 id="settings-title">Settings</h1><button id="setclose" class="ghost ib" type="button" aria-label="Close settings" title="Close (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="settabs" class="set-tabs" role="tablist" aria-label="Settings sections"></div>
  <div class="set-panes">
    <section id="set-computers" class="set-pane" role="tabpanel" hidden>
      <h2>Computers</h2>
      <p class="hint">Where Talaria can run commands and change files for you. To add one, run <code>talaria setup</code> on it.</p>
      <div id="devices" aria-live="polite"></div>
    </section>
    <section id="set-notifications" class="set-pane" role="tabpanel" hidden><div id="notify-prefs" class="notify-prefs" aria-live="polite"></div></section>
    <section id="set-telegram" class="set-pane" role="tabpanel" hidden></section>
    <section id="set-claude" class="set-pane" role="tabpanel" hidden></section>
    <section id="set-account" class="set-pane" role="tabpanel" hidden></section>
  </div>
</dialog>
</body>
</html>
