<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Hermes Hub</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bar">
  <button id="back" class="icon" hidden aria-label="Back to chat">&lsaquo;</button>
  <div class="title"><span id="title">Hermes Hub</span><span id="subtitle" class="sub"></span></div>
  <button id="newchat" class="ghost" hidden>New chat</button>
  <button id="more" class="ghost" hidden>More</button>
  <button id="refresh" class="icon" aria-label="Refresh">&#x21bb;</button>
  <button id="stop" class="danger" hidden>Stop</button>
  <button id="logout" class="ghost">Log out</button>
</header>
<div id="banner" class="banner" hidden></div>
<main id="list" class="list"></main>
<main id="chat" class="chat" hidden>
  <div id="log" class="log" aria-live="polite"></div>
</main>
<form id="composer" class="composer" hidden>
  <textarea id="input" rows="1" placeholder="Message Hermes" aria-label="Message"></textarea>
  <button id="send" class="primary" type="submit">Send</button>
</form>
</body>
</html>
