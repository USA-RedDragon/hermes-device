---
version: 2

project_name: talaria-hub

# The hub is released from the talaria monorepo with tags hub/vX.Y.Z. The
# release workflow (.github/workflows/hub-release.yaml) passes vX.Y.Z as
# GORELEASER_CURRENT_TAG and makes the GitHub release on hub/vX.Y.Z itself,
# so goreleaser never creates a bare vX.Y.Z tag: that would be a daemon
# release in this repository.
release:
  disable: true

changelog:
  disable: true

dockers_v2:
  - images:
      - "ghcr.io/usa-reddragon/{{ .ProjectName }}"
      - ghcr.io/usa-reddragon/hermes-hub
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.licenses": MIT
      "org.opencontainers.image.url": "https://github.com/USA-RedDragon/talaria"
      "org.opencontainers.image.source": "https://github.com/USA-RedDragon/talaria"
    flags:
      - "--pull"

builds:
  - main: .
    binary: "{{ .ProjectName }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
      - riscv64
    goarm:
      - "6"
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
    flags:
      - -trimpath

milestones:
  - close: true
