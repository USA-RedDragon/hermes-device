# Sample configuration
# Log level: debug, info, warn or error
log_level: "info"
http:
  # HTTP server IPv4 host
  ipv4_host: "0.0.0.0"
  # HTTP server IPv6 host
  ipv6_host: "::"
  # HTTP server port
  port: 8080
  # Public base URL of the hub, such as https://hub.example.com. Sets the OIDC redirect URI (<public_url>/auth/callback), the only allowed Origin and whether cookies are Secure
  # public_url: ""
  metrics:
    # Enable the metrics server
    enabled: false
    # Metrics server IPv4 host
    ipv4_host: "127.0.0.1"
    # Metrics server IPv6 host
    ipv6_host: "::1"
    # Metrics server port
    port: 8081
oidc:
  # OIDC issuer URL, such as https://auth.example.com/application/o/talaria-hub/
  # issuer_url: ""
  # OIDC client ID
  # client_id: ""
  # OIDC client secret
  # client_secret: "(secret)"
  # Scopes to request. Authentik's profile scope carries preferred_username and groups
  scopes: ["openid", "profile", "email"]
  # ID token claim shown as the user's name. Display only: identity is always the sub claim
  display_claim: "preferred_username"
  # ID token claim that holds the group names that backends[].groups lists
  groups_claim: "groups"
session:
  # Key for the session and login cookies. At least 32 characters
  # secret: "(secret)"
  # How long a login lasts
  ttl: "168h"
ui:
  # Default backend per user, as user=backend pairs. A user without one gets their first backend
  # default_backends: []
  # IANA time zone of the times on the Scheduled page, such as Europe/Berlin. Default: the server's zone (the TZ environment variable, else /etc/localtime), else UTC
  # time_zone: ""
store:
  # Database: sqlite (a file, for one replica only) or postgres (for one or more replicas). It holds Telegram links, link tokens, users' last seen groups, the Telegram bot's state and paired devices
  driver: "sqlite"
  # Path of the SQLite database (store.driver sqlite)
  path: "/data/hermes-hub.db"
  # PostgreSQL connection string (store.driver postgres), such as postgres://hub:password@db.example.com:5432/hub. Connect to the database directly, not through a PgBouncer pool in transaction mode: the Telegram leader lock needs its own session
  # dsn: "(secret)"
  # With store.driver postgres: an SQLite database of an earlier hub to copy into PostgreSQL at startup. The copy runs once; a missing file is skipped
  # import_path: ""
shutdown:
  # How long the hub keeps serving after SIGTERM while /readyz fails, so load balancers stop sending it requests
  drain_delay: "5s"
  # How long the hub then waits for open requests and the Telegram bot to stop. Keep drain_delay plus timeout below the pod's termination grace period
  timeout: "20s"
hold:
  # How long the hub holds a message while its Hermes backend is restarting or cannot be reached. After that the user is told the message was not sent. 0 is the default
  timeout: "10m"
usage:
  # Base URL of a Prometheus query API, such as http://prometheus:9090, that scrapes the metrics of ollama-priority-proxy in front of the local GPU's Ollama. The Usage page then shows how long the GPU was busy. Empty: it does not
  # prometheus_url: ""
# Who may log in: each OIDC sub and its hub user name. A login with any other sub is refused. Only settable in the config file
# users:
#   - sub: ""
#     name: ""
# Hermes backends and who may use them. Only settable in the config file
# backends:
#   - id: ""
#     name: ""
#     url: ""
#     provider: ""
#     username: ""
#     password: "(secret)"
#     users: []
#     groups: []
#     cwd: ""
#     show_reasoning: false
#     devices: false
#     acp_url: ""
#     media_roots: []
#     service_devices:
#       - id: ""
#         name: ""
#         token: "(secret)"
#     honcho:
#       url: ""
#       workspace: ""
#       user_peer: ""
#       ai_peer: ""
#       api_key: "(secret)"
#       api_key_file: ""
#       api_key_env: ""
#     agent_messages: false
telegram:
  # Run the Telegram bot
  enabled: false
  # Telegram bot token from BotFather
  # token: "(secret)"
  # Telegram Bot API base URL
  api_url: "https://api.telegram.org"
  # Default backend per hub user, as user=backend pairs. A user without one gets their first backend
  # default_backends: []
  # Group chat IDs the bot answers in. The bot ignores every other group
  # allowed_groups: []
  # Long poll timeout for getUpdates
  poll_timeout: "50s"
  # Minimum time between edits of one live message
  edit_interval: "1500ms"
  # Retries of a Bot API call that Telegram answers with 429
  max_retries: 5
  # With store.driver postgres, only one hub replica runs the bot. This is how often each other replica tries to take it over
  leader_retry: "2s"
  # How often the bot reads the chats of each linked group to add topics for new chats, rename topics and follow the chats that run
  topic_sync: "20s"
  # How the status line of a turn shows its steps and thinking: collapsed (a quote that opens on a tap), expanded, or off
  steps: "collapsed"
  # In private chats, stream each turn into a draft (sendMessageDraft) that shows what runs and the reply as it is written, instead of editing the status line
  drafts: true
device:
  # Serve the talaria device API under /api/device/ and the pairing page /device/pair. Backends also need backends[].devices
  enabled: false
  # Ed25519 private key that signs the hub's device assertions: a PEM PRIVATE KEY block (openssl genpkey -algorithm ed25519) or the 32-byte seed in base64. Required with device.enabled unless signing_key_file is set
  # signing_key: "(secret)"
  # File that holds device.signing_key. Wins over signing_key
  # signing_key_file: ""
  # How long a pairing code from talaria setup or talaria login stays valid
  pairing_ttl: "10m"
  # How often a device may poll while it waits for the user to confirm pairing
  poll_interval: "5s"
  # How often the hub checks that each open device connection's device is not revoked and that its user may still use its backend. A revoke closes the device's connections on the replica that served it at once, and on other replicas within this time
  recheck_interval: "10s"
  # CIDRs of proxies in front of the hub, such as 10.0.0.0/8. For a request from one of them the hub takes the device's address from X-Forwarded-For. Empty: the address of the TCP peer
  # trusted_proxies: []
notify:
  # Web Push (VAPID) private key: a P-256 key as a PEM block (openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt) or the raw 32 bytes in base64url. Empty with no vapid_private_key_file: no Web Push. Keep it: a new key ends every browser's subscription
  # vapid_private_key: "(secret)"
  # File that holds notify.vapid_private_key. Wins over vapid_private_key
  # vapid_private_key_file: ""
  # How push services can reach the hub's operator: a mailto: or https: URL. Default http.public_url when that is https. With neither, the hub logs a warning and runs without Web Push
  # vapid_subject: ""
  # How long an approval or question waits before the hub reminds its person once. 0 is the default
  remind_after: "5m"
  # How often the hub looks for running chats that nobody has open, to see their approvals and questions. 0 is the default
  watch_interval: "15s"
  # How often the hub reads each backend's scheduled jobs for their results and failures. 0 is the default
  job_interval: "1m"
claude:
  # Who may sign the Claude accounts of a backend in from the hub, as user=backend pairs. They see the sign-in controls and get the sign-in notices; the backend's other users see only usage. Empty: nobody
  # admins: []
  # IANA time zone of the reset times of Claude usage windows and of the days of Claude Code usage. Default: ui.time_zone
  # time_zone: ""
