name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check the generated parts of the docs
        run: go run github.com/USA-RedDragon/docgen@v0.0.0-20261109224744-ef1962a8c996 check -diff
      - name: Install pandoc
        run: docs/site/install-pandoc.sh "$RUNNER_TEMP/pandoc" >>"$GITHUB_PATH"
      - name: Build the docs site
        run: docs/site/build.sh
      - name: Check the links of the docs site
        run: docs/site/check-links.py artifacts/docs-site
      - name: Upload the docs site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: artifacts/docs-site
          retention-days: 14
