# Sample configuration
# Log level: debug, info, warn or error
log-level: "info"
# Interval of WebSocket pings on every leg. Must be from 5s to 30s
ping-interval: "25s"
hub:
  # Base URL of the Talaria hub, for example https://hub.example.com. Needed by login, run, chat and acp
  # url: ""
  # Device token for run, instead of the one login stored, for a service device such as the sandbox pod. Wins over hub.token-file and the token store
  # token: "(secret)"
  # File holding only the device token for run, for example a mounted Kubernetes secret. Must not be readable by others. Wins over the token store
  # token-file: ""
store:
  # Keep the device token in the OS keyring when one is available
  keyring: true
  # File (mode 0600) for the device token when the keyring is off or unavailable. Defaults to token in the state directory
  # token-file: ""
  # Directory for the token file and the daemon's state file. Defaults to talaria in the user config directory
  # state-dir: ""
device:
  # Absolute directories commands may run in. A command whose working directory is outside all of them is refused. Defaults to the home directory
  # roots: []
  # Directory Hermes uses on this device for its shell snapshot files. Defaults to the system temp directory
  # tmp-dir: ""
  # Shell used to run commands
  shell: "bash"
  # Most output bytes per command that run keeps for a resume of the exec leg until the plugin confirms them. Older output of a command is dropped, and the plugin shows the gap
  resume-buffer: 1048576
  # Longest time run keeps commands running after the exec leg drops, waiting for a resume. The plugin's grace_seconds applies when it is shorter
  max-grace: "10m"
  # Memory cap of each agent command, as bytes or with a K, M, G or T suffix (powers of 1024), for example 4G. On Linux with a systemd user manager, run starts each command in a systemd scope of its own with this MemoryMax, so the kernel kills only a command that uses more, and the agent is told so. auto is 75% of the MemoryMax of the cgroup that run runs in (the talaria service), or 4G when that has no limit. 0 or off runs commands in run's own cgroup, without a cap of their own. No effect on macOS
  command-memory-max: "auto"
gateway:
  # Loopback address of the chat splice. Port 0 picks a free port
  listen: "127.0.0.1:0"
  # Run the chat splice in run. false (or run --no-splice) runs only the exec leg: no listener, no daemon state file and no whoami call, for a headless service device such as the sandbox pod
  splice: true
chat:
  # On Linux, run the exact Hermes build the server runs: run fetches it from the server's container image by digest when the server reports one, verifies it and keeps it in chat.managed-dir. false, or no image from the server, runs chat.hermes instead
  managed: true
  # Directory for the managed Hermes builds and their own Hermes home. Defaults to talaria/hermes in the user cache directory
  # managed-dir: ""
  # Local Hermes launcher when chat.managed is off or the server reports no image. It must be the same release as the server's Hermes
  hermes: "hermes"
acp-host:
  # Address the ACP host listens on. Only the Talaria hub may reach it
  listen: ":9130"
  # This backend's id, the aud the hub puts in its assertions. Needed by acp-host
  # backend-id: ""
  # Hub Ed25519 public keys: PEM PUBLIC KEY blocks or base64 lines of the raw 32 bytes
  # hub-public-key: ""
  # File holding the hub public keys, in the same format as hub-public-key
  # hub-public-key-file: ""
  # Hermes launcher that the host runs as <hermes> acp for each connection
  hermes: "hermes"
  # Server directory that stands in for the device directory in ACP session cwds. Must match the device plugin's placeholder. Needed by acp-host
  # placeholder: ""
  # Most hermes acp processes the host runs at once
  max-processes: 8
  # Bindings file the device plugin writes. Defaults to device/bindings.json in $HERMES_HOME
  # bindings-file: ""
  # Health URL of the pod's Hermes gateway. The host starts hermes acp only while it answers, because hermes acp starts a gateway of its own when none runs. Empty turns the check off
  gateway-health-url: "http://127.0.0.1:9120/api/health"
reconnect:
  # First delay after a lost connection
  min-backoff: "1s"
  # Longest delay between attempts
  max-backoff: "30s"
browser:
  # Serve the Hermes Firefox extension on a private socket in the state directory and offer browser control to the plugin, so the agent can use tabs in its tab group. Run talaria browser install once
  enabled: false
  # Loopback or private network host names the agent may open. All other loopback, private, link-local and CGNAT addresses are blocked in agent tabs
  # allow-hosts: []
  # Sites where every click and every Enter or Space key press asks the user each time and scripts may only read. Host names; each covers its subdomains. The plugin cannot change this list
  # confirm-hosts: []
  # Exact host names where browser_login may submit the login form that Firefox fills from its own saved login, so a scheduled job can sign in without the agent seeing the password. Only https pages whose top-level host is listed; no subdomains. Scripts are refused there, and clicks, typing, key presses and screenshots on its login pages. Example: login.w3.ibm.com. The plugin cannot change this list
  # autologin-hosts: []
  # Let the agent start Firefox, with the user's default profile, in the user's graphical session when the extension is not connected, so a scheduled job works after Firefox was closed. The sandbox image turns it off
  start-firefox: true
  # Command that starts Firefox for start-firefox: a name on PATH or an absolute path
  firefox-command: "firefox"
mcp:
  # MCP servers the agent may use on this device, by name: lowercase letters, digits, - and _, at most 32 characters. Each one runs on this device with stdio, started on first use. Only servers listed here can run. Config file only
  # servers:
  #   example:
  #     command: ""
  #     args: []
  #     env:
  #       example: ""
  #     dir: ""
  #     idle-timeout: "0s"
  # Stop an MCP server after this long without a request. It starts again on the next request, without its earlier state. 0 keeps it running until run stops
  idle-timeout: "1h"
update:
  # Let run install new releases by itself: it checks GitHub, verifies the release like talaria update, waits until no command, browser operation, MCP call or chat runs, and exits so the service restarts it. Only when the talaria service runs it and the device token comes from login, so never on a service device that uses hub.token or hub.token-file. The sandbox and device images turn it off
  auto: true
  # Time between release checks of run, with up to 10% jitter. At least 1h
  interval: "6h"
usage:
  # Count the tokens Claude Code used here and send the counts to the hub: only token counts, model names, account ids, the signed-in account's email and project folder names, never what was said. Unset: on for run, except in a container, and on for acp-host
  # enabled: false
  # More Claude Code config directories (CLAUDE_CONFIG_DIR values) to count, besides $CLAUDE_CONFIG_DIR or ~/.claude
  # claude-dirs: []
  # acp-host: directory of the per-account Claude Code directories. Defaults to $CLAUDE_ACCOUNTS_ROOT, else claude in $HERMES_HOME
  # hermes-accounts-dir: ""
  # File that keeps what was counted across restarts. Defaults to claude-usage.gob in the state directory for run, and device/claude-usage.gob in $HERMES_HOME for acp-host
  # state-file: ""
