<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>Hermes browser control</h1>
<p id="status"></p>
<p id="hub" class="muted"><span id="hub-text"></span> <a id="change" href="#">Change</a></p>
<p id="hint" class="muted" hidden></p>
<p id="error" class="err" hidden></p>
<div>
<button id="sign-in" hidden>Sign in to Hermes</button>
<button id="sign-out" hidden>Sign out</button>
<button id="use" hidden>Use this Firefox</button>
</div>
<script src="popup.js"></script>
</body>
</html>
